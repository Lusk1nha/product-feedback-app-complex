services:
  # --- Backend Service (NestJS) ---
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: product-feedback-api
    container_name: product_feedback_api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # O Host do banco aqui TEM que ser o nome do container 'db'
      DATABASE_URL: postgres://postgres:postgres@db:5432/product_feedback

      # Secrets
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-changeme}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      JWT_ACCESS_EXPIRES_IN_MS: 900000
      JWT_REFRESH_EXPIRES_IN_MS: 604800000

      # Para CORS (Navegador -> API)
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - db
      - redis
    networks:
      # <--- FALTAVA ISSO
      - app-network
    restart: unless-stopped

  # --- Frontend Service (Vite) ---
  web:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: product_feedback_web
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: production
      VITE_API_TARGET: http://api:3000

    depends_on:
      - api
    networks:
      # Já estava aqui, correto
      - app-network

  # --- Database Service (Postgres) ---
  db:
    image: postgres:17
    container_name: product_feedback_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_feedback
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      # <--- FALTAVA ISSO
      - app-network
    # --- Redis Service ---
  redis:
    image: redis:alpine
    container_name: product_feedback_redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    # Opcional: Persistência de dados (geralmente pub/sub não precisa, mas é bom ter)
    command: redis-server --appendonly yes 
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: product_feedback_redis_insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - app-network

  realtime:
    image: elixir:1.18-alpine
    container_name: product_feedback_realtime
    # Instala gerenciadores de pacote e roda o servidor
    command: sh -c "mix local.hex --force && mix local.rebar --force && mix deps.get && mix phx.server"
    working_dir: /app
    volumes:
      - ./apps/realtime:/app
    ports:
      - "4000:4000"
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-changeme}
      PHX_HOST: "localhost"
    depends_on:
      - db
      - redis
    networks:
      - app-network      

# Definição da Rede
networks:
  app-network:
    driver: bridge

# Definição do Volume Persistente
volumes:
  postgres_data:
  redis_data:
